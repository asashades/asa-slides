<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contoh deck: biaya satu tas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!--
  ENGINE TEMPLATE · slide-interaktif-animatif
  Bagian yang diubah per deck:
    [A] TOKEN TEMA   (CSS :root, lihat references/tema.md)
    [B] CSS ADEGAN   (gaya khusus adegan explainer deck ini)
    [C] KONFIGURASI  (DECK: judul, dosen, bagian & menit)
    [D] SLIDE        (add(...) satu per slide)
  Bagian MESIN tidak perlu diubah. Dokumentasi API: references/mesin-slide.md
-->
<style>
/* ===================== [A] TOKEN TEMA ===================== */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#E7EDF1; --ink:#13202A; --muted:#4D5B67; --line:#D0D9E0;
  --accent:#0B6E8A; --accent-ink:#FFFFFF; --accent-soft:#DCEEF3;
  --bad:#B4382C; --bad-soft:#F8E2DE; --warn:#8F5B05; --warn-soft:#FAEDD3; --good:#1B7548; --good-soft:#DCF0E4;
  --f-head:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:12px; --gap:20px;
  --ease:cubic-bezier(.22,.7,.2,1); --dur:.5s;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#162028; --surface-2:#1E2A33; --ink:#E6ECF1; --muted:#A2B0BB; --line:#2A3843;
  --accent:#5BBBD3; --accent-ink:#0A1A20; --accent-soft:#143440;
  --bad:#EE8B7F; --bad-soft:#3A201E; --warn:#E2B158; --warn-soft:#382C14; --good:#6CCB9B; --good-soft:#163226;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#162028; --surface-2:#1E2A33; --ink:#E6ECF1; --muted:#A2B0BB; --line:#2A3843;
  --accent:#5BBBD3; --accent-ink:#0A1A20; --accent-soft:#143440;
  --bad:#EE8B7F; --bad-soft:#3A201E; --warn:#E2B158; --warn-soft:#382C14; --good:#6CCB9B; --good-soft:#163226;
  color-scheme:dark}

/* ===================== MESIN: dasar & tata letak ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 clamp(16px,.55vw + 12px,20px)/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.fa{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.125em}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-width:1360px;margin:0 auto;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
.brand{margin-right:auto;min-width:0;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52ch,60vw)}
.brand small{color:var(--muted);font-weight:500}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:var(--accent)}
.ib:focus-visible,.btn:focus-visible,.opt:focus-visible,.gc:focus-visible,.prog button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.timer{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 10px 3px 3px}
.timer .ib{width:32px;height:32px;border:0;background:var(--accent);color:var(--accent-ink)}
.timer .ib.ghost{background:transparent;color:var(--ink)}
.td{display:grid;line-height:1.1}.td b{font:600 .98rem var(--f-mono)}.td small{font-size:.7rem;color:var(--muted)}
.td.over b{color:var(--bad)}
.prog{display:flex;gap:6px;padding-bottom:6px}
.prog button{flex:var(--w) 1 0;min-width:0;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.prog span{display:block;font:500 .7rem var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.prog .now span{color:var(--ink);font-weight:600}
.prog .tr{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .tr i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
#stage{overflow-y:auto;overflow-x:hidden;min-height:0;padding:10px 0 14px}
.sl{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:var(--gap)}
.sl.enter{animation:slin .45s var(--ease)}
@keyframes slin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 max(14px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.82rem;font-weight:500}
.pg{font:500 .9rem var(--f-mono);color:var(--muted)}.pg b{color:var(--ink)}
@media (max-width:640px){.btn .w{display:none}.timer .td:nth-child(3){display:none}}

/* ===================== MESIN: tipografi & blok isi ===================== */
.eyebrow{font:600 .875rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{font:700 clamp(2.3rem,4.6vw,4rem)/1.06 var(--f-head);letter-spacing:-.01em;margin:.25em 0 .2em;max-width:18ch;text-wrap:balance}
.st{font:700 clamp(1.55rem,2.8vw,2.5rem)/1.14 var(--f-head);margin:.2em 0 0;text-wrap:balance}
.lede{color:var(--muted);margin:.45em 0 0;max-width:64ch;text-wrap:pretty}
p,li{text-wrap:pretty}
.sl p{max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card h3{font:650 1.08rem/1.3 var(--f-body);margin:0 0 .35em}
.card p{margin:0;color:var(--muted)}
.tag{font:600 .74rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:start}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.list li{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:10px;align-items:start}
.list .fa{color:var(--accent);margin-top:.25em;width:1.15em;height:1.15em}
.formula{font:600 clamp(1rem,1.6vw,1.3rem) var(--f-mono);background:var(--accent-soft);border-radius:10px;padding:12px 16px;max-width:max-content}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(8px,1.4vw,16px);min-width:0}
.scene svg{display:block;width:100%;height:auto;max-height:54vh}
.scroll-x{overflow-x:auto}
.cover{display:grid;gap:4px;max-width:900px}
.meta{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 0}
.meta div{display:grid}.meta dt{font:600 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.meta dd{margin:0;font-weight:600}

/* ===================== MESIN: sistem tahap ===================== */
/* Elemen dengan data-from="n" tampil mulai tahap n (data-to="m" sampai tahap m). */
[data-from]{opacity:0;transform:translateY(8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
[data-from].on{opacity:1;transform:none}
svg [data-from]{transform:none}
/* Gerak explainer siap pakai (tambahkan kelas + data-from) */
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s var(--ease),opacity .3s}
.draw.on{stroke-dashoffset:0}
.grow-y,.grow-x{transform-box:fill-box;transition:transform .8s var(--ease),opacity .3s}
.grow-y{transform-origin:50% 100%;transform:scaleY(0)}.grow-x{transform-origin:0 50%;transform:scaleX(0)}
.grow-y.on,.grow-x.on{transform:none}
[data-move]{transition:transform .8s var(--ease),fill .4s,opacity .4s}
[data-now]{transition:opacity .35s,filter .35s}
.dimmed [data-now]:not(.now):not(.only){opacity:.3}
.sl [data-now].only:not(.now){opacity:0}
.noanim,.noanim *{transition:none!important;animation:none!important}
html.rm *,html.rm *::before,html.rm *::after{transition:none!important;animation:none!important}
html:not(.js) [data-from]{opacity:1;transform:none}
.stepui{display:grid;gap:8px}
.cap{margin:0;min-height:2.7em;font-size:1.04em;max-width:72ch}
.mctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.dots{display:flex;gap:5px}.dots i{width:20px;height:6px;border-radius:3px;background:var(--surface-2)}
.dots i.done{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}.dots i.now{background:var(--accent)}

/* ===================== MESIN: kuis ===================== */
.qq{font:700 clamp(1.45rem,2.6vw,2.2rem)/1.2 var(--f-head);margin:.2em 0 0;max-width:30ch;text-wrap:balance}
.opts{display:grid;gap:10px;max-width:760px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;font-size:1.02em}
.opt i{font:600 .85rem var(--f-mono);font-style:normal;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.opt.sel{border-color:var(--accent)}.opt.sel i{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ok i{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{display:flex;gap:10px;align-items:flex-start;max-width:760px;background:var(--good-soft);border-radius:10px;padding:12px 16px}
.exp .fa{color:var(--good);width:1.2em;height:1.2em;margin-top:.15em}
.exp[hidden]{display:none}
.khint{font:500 .875rem var(--f-mono);color:var(--muted)}
kbd{font:600 .78rem var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}

/* ===================== MESIN: menu grid & lompat ===================== */
.gridv{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.gridv[hidden]{display:none}
.gv-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;max-width:1360px;margin:0 auto 16px}
.gv-h h2{font:700 1.4rem var(--f-head);margin:0;flex:1 1 auto}
.gv-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;max-width:1360px;margin:0 auto}
.gc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:96px;cursor:pointer;display:grid;gap:4px;align-content:start;min-width:0}
.gc .n{font:600 1.1rem var(--f-mono)}
.gc small{font:500 .7rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.gc b{font-weight:600;font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
.gc.now{background:var(--accent-soft);border-color:var(--accent)}
.gc.sel{outline:3px solid var(--accent);outline-offset:2px}
.jump{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);font:600 1.1rem var(--f-mono);padding:8px 16px;border-radius:10px}
.jump[hidden]{display:none}

/* ===================== MESIN: mode cetak (PDF) ===================== */
html.print .bar,html.print .prog,html.print .fnav,html.print .mctl,html.print .khint{display:none!important}
html.print #app{grid-template-rows:minmax(0,1fr)}
html.print #stage{overflow:hidden;padding:24px 8px}

/* ===================== MESIN: layar pendek (proyektor 720p/768p) ===================== */
@media (max-height:820px){.sl{gap:14px}.scene svg{max-height:40vh}.hero{font-size:clamp(2.1rem,4.2vw,3.4rem)}.cap{min-height:2.5em}#stage{padding:6px 0 8px}}

/* ===================== [B] CSS ADEGAN (dari galeri explainer) ===================== */
/* ---- gaya umum ilustrasi ---- */
.ill text{font:600 12.5px var(--f-body);fill:var(--ink)}
.ill .sm{font:500 11px var(--f-mono);fill:var(--muted)}
.ill .num{font:600 12px var(--f-mono)}
.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnm{fill:none;stroke:var(--muted);stroke-width:1.5}
.f-acc{fill:var(--accent)}.f-warn{fill:var(--warn)}.f-good{fill:var(--good)}.f-bad{fill:var(--bad)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--muted)}
.f-surf{fill:var(--surface);stroke:var(--ink);stroke-width:2}.f-s2{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.5}
.t-on{fill:var(--accent-ink)!important}

/* E1 bongkar tas */
#e1 .flap.mv{transform:translate(48px,-44px)}
#e1 .body.mv{transform:translate(-70px,8px)}
#e1 .zip.mv{transform:translate(98px,22px)}
/* E2 menara */
#e2 .blk{opacity:0;transform:translateY(-12px);transition:opacity .35s var(--ease),transform .45s var(--ease);transition-delay:calc(var(--i) * 90ms)}
#e2 .on .blk{opacity:1;transform:none}
/* E3 alur */
#e3 .tok{transition:transform .9s var(--ease)}
#e3[data-s="2"] .tok{transform:translate(130px,0)}#e3[data-s="3"] .tok{transform:translate(260px,0)}
#e3 .stn.now rect{stroke:var(--accent);stroke-width:3}
/* E4 sortir */
#e4 .n1.mv{transform:translate(6px,138px)}#e4 .n2.mv{transform:translate(142px,138px)}#e4 .n3.mv{transform:translate(-112px,138px)}#e4 .n4.mv{transform:translate(-138px,138px)}
#e4 .n2.mv rect{fill:var(--bad-soft);stroke:var(--bad)}#e4 .n2 .x{opacity:0;transition:opacity .3s .5s}#e4 .n2.mv .x{opacity:1}
/* E5 bejana */
#e5 .liq{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 1s var(--ease)}
#e5[data-s="1"] .la,#e5[data-s="2"] .la{transform:scaleY(.8)}#e5[data-s="3"] .la{transform:scaleY(.45)}#e5[data-s="3"] .lb{transform:scaleY(.38)}
/* E7 timbangan */
#e7 .beam{transform-box:view-box;transform-origin:180px 70px;transition:transform 1s var(--ease)}
#e7[data-s="1"] .beam{transform:rotate(-9deg)}#e7[data-s="2"] .beam{transform:rotate(7deg)}#e7[data-s="3"] .beam{transform:rotate(0)}
/* E10 split, E11 irisan */
#e11 .ra{transform:translate(-34px,0)}#e11 .rb{transform:translate(34px,0)}#e11 .ra.mv,#e11 .rb.mv{transform:none}
#e11 .ov{fill:var(--warn);opacity:0}#e11 .ov.on{opacity:.55}
/* E13 tokoh */
#e13 .pain path{stroke:var(--bad)}

.ill{display:block;width:100%;height:auto}
</style>
</head>

(function(){

document.documentElement.classList.add('js');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const slides=[];
function add(sec,o){o.sec=sec;slides.push(o);return o}

/* ===================== [C] KONFIGURASI ===================== */
const DECK={
  course:'Contoh deck',            // atau nama pelatihan
  meeting:'Biaya produksi',
  presenter:'Contoh',
  sections:[                             // menit tiap bagian; totalnya = durasi sesi
    {name:'Bongkar',min:10},
    {name:'Kelompokkan',min:15},
    {name:'Putuskan',min:20}
  ]
};

/* ===================== HELPER untuk penulis slide ===================== */
function ico(n,c){return '<svg class="fa'+(c?' '+c:'')+'" aria-hidden="true"><use href="#fa-'+n+'"/></svg>'}
function head(t,l){const s=DECK.sections[cur.sec];t=t||cur.title;
  return '<header><div class="eyebrow">Bagian '+(cur.sec+1)+' · '+s.name+'</div><h2 class="st">'+t+'</h2>'+(l?'<p class="lede">'+l+'</p>':'')+'</header>'}
const rp=v=>'Rp'+Math.round(v).toLocaleString('id-ID');
const pct=(v,d)=>v.toLocaleString('id-ID',{maximumFractionDigits:d==null?1:d})+'%';
/* Angka bergerak: count(el, tujuan, format, anim) */
function count(el,to,fmt,anim){if(!el)return;fmt=fmt||(v=>Math.round(v).toLocaleString('id-ID'));const from=el._v==null?0:el._v;el._v=to;
  if(!anim||document.documentElement.classList.contains('rm')){el.textContent=fmt(to);return}
  const t0=performance.now(),d=800;(function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

    '<div class="card"><div class="tag">Pengelompokan</div><h3>Dua cara membaca biaya yang sama</h3><p>Biaya utama: bahan dan upah langsung. Biaya konversi: upah langsung dan biaya pabrik.</p></div></div>'+
    '<p class="lede">Angka di deck ini ilustrasi untuk menunjukkan gerak penjelasan, bukan data usaha tertentu.</p>'});

/* ===================== MESIN (tidak perlu diubah) ===================== */
const TOTAL_MIN=DECK.sections.reduce((a,s)=>a+s.min,0);
const stage=$('#stage');let idx=-1,cur=null,step=0;
const nsteps=s=>s.quiz?1:(s.steps||1);
const kindOf=s=>s.quiz?'Kuis':(nsteps(s)>1?nsteps(s)+' tahap':'Slide');
const titleOf=(s,i)=>s.title?(s.quiz?'Kuis: '+s.quiz.q:s.title):'Slide '+(i+1);
const rm=matchMedia('(prefers-reduced-motion: reduce)');
const setRM=()=>document.documentElement.classList.toggle('rm',rm.matches);setRM();rm.addEventListener&&rm.addEventListener('change',setRM);

$('#brand').innerHTML=DECK.course+' <small>· '+DECK.meeting+'</small>';
document.title=DECK.course+' · '+DECK.meeting;

function quizHTML(s){const z=s.quiz,st=s.qs||(s.qs={sel:null,rev:false});
  return '<div><div class="eyebrow">Kuis · Bagian '+(s.sec+1)+'</div><h2 class="qq">'+z.q+'</h2></div><div class="opts">'+
    z.o.map((t,i)=>{const c=st.rev?(i===z.a?'ok':(i===st.sel?'no':'')):(i===st.sel?'sel':'');
      return '<button class="opt '+c+'" type="button" data-o="'+i+'"'+(st.rev?' disabled':'')+'><i>'+'ABCDE'[i]+'</i><span>'+t+'</span></button>'}).join('')+'</div>'+
    '<div class="exp"'+(st.rev?'':' hidden')+'>'+ico(st.sel===z.a?'circle-check':'lightbulb')+'<span>'+(st.sel===z.a?'Tepat. ':'Jawaban: '+'ABCDE'[z.a]+'. ')+z.e+'</span></div>'+
    (st.rev?'':'<p class="khint"><kbd>↑</kbd> <kbd>↓</kbd> pilih jawaban kelas · <kbd>→</kbd> buka jawaban</p>')}
function stepUI(n){let d='';for(let i=0;i<n;i++)d+='<i></i>';
  return '<div class="stepui"><p class="cap"></p><div class="mctl"><div class="dots" aria-hidden="true">'+d+'</div><span class="cnt"></span>'+
    '<button class="btn sm" type="button" data-act="replay">'+ico('rotate-left')+' Ulang animasi</button></div></div>'}
function render(entering){const n=nsteps(cur);
  stage.innerHTML='<div class="sl'+(entering?' enter':'')+'">'+(cur.quiz?quizHTML(cur):cur.html())+(n>1?stepUI(n):'')+'</div>';
  stage.scrollTop=0;if(cur.bind)cur.bind(stage.firstElementChild)}
function applyStep(anim){const root=stage.firstElementChild;if(!root)return;
  if(!anim)root.classList.add('noanim');
  $$('[data-from]',root).forEach(e=>{const f=+e.dataset.from,t=e.dataset.to==null?1e9:+e.dataset.to;e.classList.toggle('on',step>=f&&step<=t)});
  $$('[data-move]',root).forEach(e=>e.classList.toggle('mv',step>=+e.dataset.move));
  let anyNow=false;$$('[data-now]',root).forEach(e=>{const on=e.dataset.now.split(/[\s,]+/).map(Number).includes(step);e.classList.toggle('now',on);if(on&&!e.classList.contains('only'))anyNow=true});
  root.classList.toggle('dimmed',anyNow);
  const n=nsteps(cur),cap=$('.cap',root);if(cap)cap.textContent=(cur.caps&&cur.caps[step])||'';
  $$('.dots i',root).forEach((d,i)=>{d.className=i<step?'done':(i===step?'now':'')});
  const cnt=$('.cnt',root);if(cnt)cnt.textContent='Tahap '+(step+1)+' dari '+n;
  if(cur.step)cur.step(step,{root,anim:!!anim&&!document.documentElement.classList.contains('rm'),q:s=>root.querySelector(s),qa:s=>[...root.querySelectorAll(s)]});
  if(!anim){void root.offsetWidth;requestAnimationFrame(()=>root.classList.remove('noanim'))}
  chrome()}
function show(i,opt){opt=opt||{};i=Math.max(0,Math.min(slides.length-1,i));const entering=i!==idx;if(entering&&cur&&cur.leave)cur.leave();idx=i;cur=slides[i];
  if(entering||opt.last)step=opt.last?nsteps(cur)-1:0;
  if(opt.last&&cur.quiz){cur.qs=cur.qs||{sel:null,rev:false};cur.qs.rev=true;if(cur.qs.sel==null)cur.qs.sel=-1}
  render(entering&&!opt.instant);
  if(entering&&!opt.last&&!opt.instant){void stage.offsetWidth;applyStep(true)}else applyStep(false);
  try{history.replaceState(null,'','#slide-'+(idx+1))}catch(e){}}
function fwd(){if(cur.quiz&&!cur.qs.rev){cur.qs.rev=true;if(cur.qs.sel==null)cur.qs.sel=-1;render(false);applyStep(false);return}
  if(step<nsteps(cur)-1){step++;applyStep(true);return}
  if(idx<slides.length-1)show(idx+1)}
function back(){if(cur.quiz&&cur.qs.rev){cur.qs.rev=false;if(cur.qs.sel===-1)cur.qs.sel=null;render(false);applyStep(false);return}
  if(step>0){step--;applyStep(true);return}
  if(idx>0)show(idx-1,{last:true})}
function replay(){const root=stage.firstElementChild;root.classList.add('noanim');$$('[data-from]',root).forEach(e=>e.classList.remove('on'));
  $$('[data-now]',root).forEach(e=>e.classList.remove('now'));$$('[data-move]',root).forEach(e=>e.classList.remove('mv'));$$('[id]',root).forEach(e=>{e._v=null});
  void root.offsetWidth;root.classList.remove('noanim');requestAnimationFrame(()=>applyStep(true))}

/* chrome: tombol, nomor, progres */
$('#prog').innerHTML=DECK.sections.map((s,i)=>'<button type="button" style="--w:'+s.min+'" data-sec="'+i+'" aria-label="Bagian '+(i+1)+': '+s.name+'"><span>'+(i+1)+'. '+s.name+'</span><div class="tr"><i></i></div></button>').join('');
function chrome(){const n=slides.length,more=step<nsteps(cur)-1;
  $('#prev').disabled=idx===0&&step===0&&!(cur.quiz&&cur.qs.rev);$('#next').disabled=idx===n-1&&!more&&!(cur.quiz&&!cur.qs.rev);
  $('#nextLbl').textContent=cur.quiz&&!cur.qs.rev?'Buka jawaban':(more?'Tahap berikutnya':'Berikutnya');
  $('#pg').innerHTML='<b>'+(idx+1)+'</b> / '+n;
  const inSec=slides.filter(s=>s.sec===cur.sec),pos=inSec.indexOf(cur)+1;
  $$('#prog button').forEach((b,i)=>{b.classList.toggle('now',i===cur.sec);b.setAttribute('aria-current',i===cur.sec?'step':'false');
    $('i',b).style.width=(i<cur.sec?100:i===cur.sec?pos/inSec.length*100:0)+'%'});
  paintTimer()}

/* timer per bagian */
const T={run:false,iv:null,sec:[],tot:0};
function resetTimer(){T.sec=DECK.sections.map(s=>s.min*60);T.tot=TOTAL_MIN*60;paintTimer()}
const mmss=v=>{const a=Math.abs(v);return (v<0?'-':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
function paintTimer(){if(!cur)return;$('#tSec').textContent=mmss(T.sec[cur.sec]);$('#tLbl').textContent='sisa bagian '+(cur.sec+1);$('#tTot').textContent=mmss(T.tot);
  $('#tdSec').classList.toggle('over',T.sec[cur.sec]<0);$('#tPlay').innerHTML=ico(T.run?'pause':'play')}
function toggleTimer(){T.run=!T.run;clearInterval(T.iv);if(T.run)T.iv=setInterval(()=>{T.sec[cur.sec]--;T.tot--;paintTimer()},1000);paintTimer()}
$('#tPlay').onclick=toggleTimer;$('#tReset').onclick=()=>{if(T.run)toggleTimer();resetTimer()};

/* menu grid + lompat nomor */
const gv=$('#gridv'),jp=$('#jump');let gsel=0,gbuf='',gt=null;
function openGrid(){gv.innerHTML='<div class="gv-h"><h2>Semua slide ('+slides.length+')</h2><span class="khint"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> pilih · <kbd>Enter</kbd> buka · ketik nomor · <kbd>Esc</kbd> tutup</span>'+
  '<button class="btn sm" type="button" data-act="gclose">'+ico('xmark')+' Tutup</button></div><div class="gv-g">'+
  slides.map((s,i)=>'<button type="button" class="gc'+(i===idx?' now':'')+'" data-gi="'+i+'"><span class="n">'+(i+1)+'</span><small>Bagian '+(s.sec+1)+' · '+kindOf(s)+'</small><b>'+titleOf(s,i)+'</b></button>').join('')+'</div>';
  gsel=idx;gbuf='';gv.hidden=false;gv.scrollTop=0;gv.focus();gpaint()}
function closeGrid(){gv.hidden=true;gbuf='';if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function gcols(){const c=$$('.gc',gv);if(!c.length)return 1;const y=c[0].offsetTop;let n=0;while(n<c.length&&c[n].offsetTop===y)n++;return n||1}
function gpaint(){const c=$$('.gc',gv);c.forEach((e,i)=>e.classList.toggle('sel',i===gsel));if(c[gsel]&&c[gsel].scrollIntoView)c[gsel].scrollIntoView({block:'nearest'})}
function jumpShow(){jp.hidden=!gbuf;jp.textContent=gbuf?'Ke slide '+gbuf+' (Enter)':'';clearTimeout(gt);gt=setTimeout(()=>{gbuf='';jp.hidden=true},3500)}
function gridKey(e){const k=e.key;
  if(gv.hidden){
    if(k==='g'||k==='G'){e.preventDefault();openGrid();return true}
    if(/^[0-9]$/.test(k)){gbuf=(gbuf+k).slice(-3);jumpShow();return true}
    if(gbuf&&k==='Enter'){e.preventDefault();const n=+gbuf;gbuf='';jp.hidden=true;show(n-1);return true}
    if(gbuf&&k==='Backspace'){gbuf=gbuf.slice(0,-1);jumpShow();return true}
    if(gbuf&&k==='Escape'){gbuf='';jp.hidden=true;return true}
    return false}
  const n=slides.length,c=gcols();
  if(k==='Escape'||k==='g'||k==='G'){e.preventDefault();closeGrid();return true}
  if(k==='f'||k==='F')return false;
  e.preventDefault();
  if(k==='ArrowRight')gsel=Math.min(n-1,gsel+1);else if(k==='ArrowLeft')gsel=Math.max(0,gsel-1);
  else if(k==='ArrowDown')gsel=Math.min(n-1,gsel+c);else if(k==='ArrowUp')gsel=Math.max(0,gsel-c);
  else if(k==='Home')gsel=0;else if(k==='End')gsel=n-1;
  else if(k==='Enter'||k===' '){closeGrid();show(gsel);return true}
  else if(/^[0-9]$/.test(k)){gbuf=(gbuf+k).slice(-3);let v=+gbuf;if(v<1||v>n){gbuf=k;v=+k}gsel=Math.max(0,Math.min(n-1,v-1));clearTimeout(gt);gt=setTimeout(()=>{gbuf=''},1500)}
  else if(k==='Backspace')gbuf=gbuf.slice(0,-1);
  gpaint();return true}

/* input */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');
  if(a){if(a.dataset.act==='replay')replay();else if(a.dataset.act==='gclose')closeGrid();return}
  const g=e.target.closest('[data-gi]');if(g){closeGrid();show(+g.dataset.gi);return}
  const o=e.target.closest('.opt');if(o&&cur.quiz&&!cur.qs.rev){cur.qs.sel=+o.dataset.o;cur.qs.rev=true;render(false);applyStep(false);return}
  const p=e.target.closest('#prog button');if(p){const s=+p.dataset.sec;show(slides.findIndex(x=>x.sec===s))}});
$('#prev').onclick=back;$('#next').onclick=fwd;$('#gridBtn').onclick=()=>gv.hidden?openGrid():closeGrid();
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(gridKey(e))return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){e.preventDefault();fwd()}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();back()}
  else if(k==='ArrowUp'||k==='ArrowDown'){const d=k==='ArrowUp'?-1:1;e.preventDefault();
    if(cur.quiz&&!cur.qs.rev){const m=cur.quiz.o.length,s=cur.qs.sel;cur.qs.sel=s==null||s<0?(d>0?0:m-1):(s+d+m)%m;render(false);applyStep(false);return}
    if(cur.vert&&cur.vert(d,e.shiftKey))return;
    if(stage.scrollHeight>stage.clientHeight+4)stage.scrollBy({top:d*140,behavior:'smooth'})}
  else if(k==='Home')show(0);else if(k==='End')show(slides.length-1);
  else if(k==='t'||k==='T')toggleTimer();else if(k==='f'||k==='F')$('#fsBtn').click()});
let tx=0,ty=0;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(e.target.closest('button,.scroll-x'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<50)(dx<0?fwd:back)()},{passive:true});
addEventListener('resize',()=>{if(cur)applyStep(false)});
$('#themeBtn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('deck-theme',r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem('deck-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('#fsBtn').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
addEventListener('hashchange',()=>{const h=/^#slide-(\d+)$/.exec(location.hash);if(h&&+h[1]-1!==idx)show(+h[1]-1)});

/* API untuk skrip uji & PDF (scripts/*.js) */
window.deck={count:()=>slides.length,
  go:(i,mode)=>show(i,mode==='last'?{last:true}:{instant:true}),
  state:()=>({idx,step,steps:nsteps(cur),kind:kindOf(cur),title:titleOf(cur,idx),sec:cur.sec}),
  titles:()=>slides.map(titleOf),
  print:on=>{document.documentElement.classList.toggle('print',!!on);document.documentElement.classList.toggle('rm',!!on||rm.matches);if(T.run)toggleTimer()},
  totalMin:TOTAL_MIN};

resetTimer();
const m0=/^#slide-(\d+)$/.exec(location.hash);show(m0?+m0[1]-1:0);
})();
</script>
